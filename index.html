<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>سجل الدروس الخصوصية</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f8f7;--grid:#dfe8e5;--card:#fff;--ink:#12302f;--mut:#5d7472;--line:#cddad7;--pri:#0f5a57;--priT:#fff;--ok:#1d7a4a;--okB:#e1f3e8;--bad:#b3341f;--badB:#fbe6e1;--warn:#8a5a00;--warnB:#fdf0d2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1b1a;--grid:#162a28;--card:#142524;--ink:#e4f0ee;--mut:#8fa9a6;--line:#27403e;--pri:#4fc3bb;--priT:#06201f;--ok:#6fd49b;--okB:#15382a;--bad:#ff9a86;--badB:#3d1d17;--warn:#f0c15c;--warnB:#3a2d0c}}
:root[data-theme="dark"]{--bg:#0e1b1a;--grid:#162a28;--card:#142524;--ink:#e4f0ee;--mut:#8fa9a6;--line:#27403e;--pri:#4fc3bb;--priT:#06201f;--ok:#6fd49b;--okB:#15382a;--bad:#ff9a86;--badB:#3d1d17;--warn:#f0c15c;--warnB:#3a2d0c}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background-color:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px;color:var(--ink);font-family:"IBM Plex Sans Arabic",Tahoma,sans-serif;line-height:1.6}
.wrap{max-width:880px;margin:0 auto;padding:16px 14px 60px}
h1{font-size:1.5rem;margin:6px 0 2px}
.sub{color:var(--mut);margin:0 0 14px;font-size:.92rem}
.total{background:var(--pri);color:var(--priT);border-radius:14px;padding:16px 18px;display:flex;flex-wrap:wrap;gap:6px 24px;align-items:baseline;justify-content:space-between}
.total .big{font-size:2.1rem;font-weight:700;line-height:1.2}
.total small{opacity:.85;display:block;font-size:.85rem}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:10px 0 14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.stat b{display:block;font-size:1.1rem}.stat span{color:var(--mut);font-size:.82rem}
nav{display:flex;gap:4px;border-bottom:2px solid var(--line);margin-bottom:14px}
nav button{flex:1;background:none;border:0;padding:10px 4px;font:inherit;font-weight:500;color:var(--mut);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px}
nav button.on{color:var(--pri);border-bottom-color:var(--pri);font-weight:700}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
.box h2{font-size:1.05rem;margin:0 0 10px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
label{display:block;font-size:.85rem;color:var(--mut);margin-bottom:2px}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
input:focus-visible,select:focus-visible,button:focus-visible,textarea:focus-visible{outline:2px solid var(--pri);outline-offset:1px}
.btn{font:inherit;font-weight:700;background:var(--pri);color:var(--priT);border:0;border-radius:8px;padding:9px 16px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--pri);border:1px solid var(--pri)}
.btn.sm{padding:4px 10px;font-size:.82rem}
.btn.del{background:transparent;color:var(--bad);border:1px solid var(--bad)}
.chip{display:inline-block;border-radius:99px;padding:1px 10px;font-size:.8rem;font-weight:500}
.ok{background:var(--okB);color:var(--ok)}.bad{background:var(--badB);color:var(--bad)}.warn{background:var(--warnB);color:var(--warn)}
.sess{border:1px solid var(--line);border-inline-start:5px solid var(--pri);border-radius:10px;background:var(--card);padding:10px 12px;margin-bottom:10px}
.sess.absent{border-inline-start-color:var(--bad)}
.sess .top{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center}
.sess .meta{color:var(--mut);font-size:.88rem;margin:2px 0 8px}
.sess .acts{display:flex;gap:8px;flex-wrap:wrap;align-items:end}
.sess .acts>div{width:110px}
.stars{color:#d99a00;letter-spacing:1px}
.empty{text-align:center;color:var(--mut);padding:22px 8px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.88rem;min-width:860px}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:start;white-space:nowrap}
th{color:var(--mut);font-weight:500}
tfoot td{font-weight:700;border-top:2px solid var(--ink)}
.n{font-variant-numeric:tabular-nums}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.save{position:fixed;inset-inline-start:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);border-radius:8px;padding:4px 12px;font-size:.8rem;opacity:0;transition:opacity .2s}
.save.on{opacity:.9}
</style>
</head>
<body>
<div class="wrap">
  <h1>سجل الدروس الخصوصية</h1>
  <p class="sub">الحصص، الحضور، التفاعل، والدفعات بالدينار الكويتي</p>
  <div id="top"></div>
  <nav>
    <button data-t="sessions" class="on">الحصص</button>
    <button data-t="students">الطلاب</button>
    <button data-t="report">التقارير</button>
  </nav>
  <main id="main"></main>
  <div class="box"><h2>النسخة الاحتياطية</h2><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn ghost sm" id="bkB">تنزيل نسخة احتياطية</button><label class="btn ghost sm" style="margin:0;cursor:pointer;color:var(--pri)">استعادة من ملف<input type="file" id="bkR" accept=".json,application/json" hidden></label></div><textarea id="bkT" rows="3" hidden style="margin-top:8px"></textarea><p class="sub" id="bkM" style="margin:8px 0 0"></p></div>
</div>
<div class="save" id="save">تم الحفظ</div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const kd=n=>(Math.round((+n||0)*1000)/1000).toFixed(3)+' د.ك';
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
let S={students:[],sessions:[],payments:[]},tab='sessions',fStu='',fMonth='',docRef=null;
const LS='tutor-manager-v1';

/* ---- storage: private db if available, else browser storage ---- */
async function init(){
  try{const raw=localStorage.getItem(LS);if(raw)S=JSON.parse(raw)}catch(e){}S.payments=S.payments||[];
  draw();
  try{
    const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
    if(db&&user){
      const id=await user.id();
      if(id){
        docRef=db.collection('data/users/'+id).doc('tutor');
        const snap=await docRef.get();
        if(snap.exists){S=Object.assign({students:[],sessions:[],payments:[]},snap.data());S.payments=S.payments||[];draw()}
        else if(S.students.length||S.sessions.length){await docRef.set(S)}
      }
    }
  }catch(e){}
}
async function save(){
  try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}
  try{if(docRef)await docRef.set(JSON.parse(JSON.stringify(S)))}catch(e){}
  const el=$('#save');el.classList.add('on');setTimeout(()=>el.classList.remove('on'),1200);
}

/* ---- helpers ---- */
const stu=id=>S.students.find(s=>s.id===id)||{name:'(طالب محذوف)',rate:0};
const mins=(a,b)=>{if(!a||!b)return 0;const[x,y]=a.split(':').map(Number),[p,q]=b.split(':').map(Number);let d=(p*60+q)-(x*60+y);if(d<0)d+=1440;return d};
const dur=m=>m?(m>=60?Math.floor(m/60)+' س ':'')+(m%60?m%60+' د':''):'';
const dayN=d=>{try{return new Date(d+'T00:00:00').toLocaleDateString('ar',{weekday:'long'})}catch(e){return ''}};
const stars=n=>n?'<span class="stars" title="التفاعل">'+'★'.repeat(n)+'☆'.repeat(5-n)+'</span>':'<span class="chip warn">بلا تقييم</span>';
const status=s=>{const d=+s.due||0,p=eff(s);if(d<=0&&p<=0)return['<span class="chip warn">لا مستحقات</span>','warn'];if(p>=d)return['<span class="chip ok">مدفوع</span>','ok'];if(p>0)return['<span class="chip warn">جزئي</span>','warn'];return['<span class="chip bad">غير مدفوع</span>','bad']};
const sum=(a,f)=>a.reduce((t,x)=>t+(+f(x)||0),0);
const eff=s=>(+s.paid||0)+(s._adv||0);
let credit={};
function alloc(){credit={};S.students.forEach(t=>credit[t.id]=sum(S.payments.filter(p=>p.sid===t.id),p=>p.amount));
 [...S.sessions].sort((a,b)=>(a.date+a.start).localeCompare(b.date+b.start)).forEach(s=>{s._adv=0;const need=Math.max(0,(+s.due||0)-(+s.paid||0)),u=Math.min(need,credit[s.sid]||0);if(u>0){s._adv=u;credit[s.sid]-=u}})}

function draw(){
  alloc();const due=sum(S.sessions,s=>s.due),paid=sum(S.sessions,s=>s.paid)+sum(S.payments,p=>p.amount),rem=sum(S.sessions,s=>Math.max(0,s.due-eff(s))),bal=sum(Object.values(credit),x=>x),att=S.sessions.filter(s=>s.att).length;
  $('#top').innerHTML=`<div class="total"><div><small>إجمالي المدفوع</small><span class="big n">${kd(paid)}</span></div><div><small>المتبقي على الطلاب</small><span class="big n">${kd(rem)}</span></div></div>
  <div class="stats"><div class="stat"><b>${S.students.length}</b><span>طلاب</span></div><div class="stat"><b>${S.sessions.length}</b><span>حصص مسجلة</span></div><div class="stat"><b>${att}</b><span>حصص حضرها الطلاب</span></div><div class="stat"><b class="n">${kd(due)}</b><span>إجمالي المستحق</span></div><div class="stat"><b class="n">${kd(bal)}</b><span>أرصدة مقدمة</span></div></div>`;
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
  ({sessions:drawSessions,students:drawStudents,report:drawReport})[tab]();
}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;draw()});

/* ---- sessions ---- */
function drawSessions(){
  if(!S.students.length){$('#main').innerHTML='<div class="box empty">أضف طالبًا أولًا من تبويب «الطلاب» ثم سجّل حصصه هنا.</div>';return}
  const opts=S.students.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('');
  const list=[...S.sessions].sort((a,b)=>(b.date+b.start).localeCompare(a.date+a.start));
  $('#main').innerHTML=`<div class="box"><h2>تسجيل حصة</h2>
  <div class="row">
   <div><label>الطالب</label><select id="f_stu">${opts}</select></div>
   <div><label>التاريخ</label><input type="date" id="f_date" value="${today()}"></div>
   <div><label>بداية الحصة</label><input type="time" id="f_start"></div>
   <div><label>نهاية الحصة</label><input type="time" id="f_end"></div>
   <div><label>الحضور</label><select id="f_att"><option value="1">حضر</option><option value="0">غاب</option></select></div>
   <div><label>التفاعل في الحصة</label><select id="f_eng"><option value="5">5 - ممتاز</option><option value="4">4 - جيد جدًا</option><option value="3" selected>3 - متوسط</option><option value="2">2 - ضعيف</option><option value="1">1 - ضعيف جدًا</option></select></div>
   <div><label>المستحق (د.ك)</label><input type="number" step="0.001" min="0" id="f_due"></div>
   <div><label>المدفوع الآن (د.ك)</label><input type="number" step="0.001" min="0" id="f_paid" value="0"></div>
  </div>
  <div style="margin-top:10px"><label>ملاحظات (الدرس، الواجب، نقاط الضعف)</label><textarea id="f_note" rows="2"></textarea></div>
  <div style="margin-top:10px"><button class="btn" id="addS">حفظ الحصة</button> <span id="err" style="color:var(--bad);font-size:.88rem"></span></div></div>
  <div class="bar"><b>آخر الحصص</b></div>
  ${list.length?list.map(sessCard).join(''):'<div class="box empty">لا توجد حصص بعد.</div>'}`;
  const fill=()=>{const s=stu($('#f_stu').value);$('#f_due').value=$('#f_att').value==='1'?s.rate:0};
  $('#f_stu').onchange=fill;$('#f_att').onchange=fill;fill();
  $('#addS').onclick=addSession;
  document.querySelectorAll('[data-pay]').forEach(b=>b.onclick=()=>{const s=S.sessions.find(x=>x.id===b.dataset.pay);s.paid=(+s.paid||0)+Math.max(0,(+s.due||0)-eff(s));save();draw()});
  document.querySelectorAll('[data-paid]').forEach(i=>i.onchange=()=>{const s=S.sessions.find(x=>x.id===i.dataset.paid);s.paid=Math.max(0,+i.value||0);save();draw()});
  document.querySelectorAll('[data-delS]').forEach(b=>b.onclick=()=>{if(b.dataset.sure){S.sessions=S.sessions.filter(x=>x.id!==b.dataset.dels);save();draw()}else{b.dataset.sure=1;b.textContent='تأكيد الحذف'}});
}
function sessCard(s){
  const st=stu(s.sid),[chip]=status(s),m=mins(s.start,s.end),rem=Math.max(0,(+s.due||0)-eff(s));
  return `<div class="sess ${s.att?'':'absent'}"><div class="top"><b>${esc(st.name)}</b><span>${s.att?'<span class="chip ok">حضر</span>':'<span class="chip bad">غاب</span>'} ${chip}</span></div>
  <div class="meta n">${s.date} • ${s.start||'--'} إلى ${s.end||'--'} ${m?'('+dur(m)+')':''}${s.att?' • التفاعل: '+stars(s.eng):''}</div>
  ${s.note?`<div class="meta">${esc(s.note)}</div>`:''}
  <div class="acts n"><div><label>المستحق</label><b>${kd(s.due)}</b></div><div><label>المتبقي</label><b>${kd(rem)}</b></div>${s._adv?`<div><label>من الرصيد المقدم</label><b>${kd(s._adv)}</b></div>`:''}
  <div><label>المدفوع</label><input type="number" step="0.001" min="0" value="${+s.paid||0}" data-paid="${s.id}"></div>
  ${rem>0?`<button class="btn sm" data-pay="${s.id}">دفع كامل</button>`:''}<button class="btn sm del" data-dels="${s.id}" data-delS>حذف</button></div></div>`;
}
function addSession(){
  const v=i=>$('#'+i).value,att=v('f_att')==='1';
  if(!v('f_start')||!v('f_end')){$('#err').textContent='أدخل وقت البداية والنهاية.';return}
  S.sessions.push({id:'s'+Date.now(),sid:v('f_stu'),date:v('f_date'),start:v('f_start'),end:v('f_end'),att,eng:att?+v('f_eng'):0,due:+v('f_due')||0,paid:+v('f_paid')||0,note:v('f_note').trim()});
  save();draw();
}

/* ---- students ---- */
function drawStudents(){
  $('#main').innerHTML=`<div class="box"><h2>إضافة طالب</h2><div class="row">
  <div><label>اسم الطالب</label><input id="n_name"></div>
  <div><label>الصف</label><input id="n_grade"></div>
  <div><label>هاتف ولي الأمر</label><input id="n_phone" inputmode="tel"></div>
  <div><label>سعر الحصة (د.ك)</label><input id="n_rate" type="number" step="0.001" min="0" value="5.000"></div></div>
  <div style="margin-top:10px"><button class="btn" id="addN">إضافة الطالب</button> <span id="err" style="color:var(--bad);font-size:.88rem"></span></div></div>
  ${S.students.length?S.students.map(s=>{const ss=S.sessions.filter(x=>x.sid===s.id),d=sum(ss,x=>x.due),p=sum(ss,eff),bal=credit[s.id]||0,pays=S.payments.filter(y=>y.sid===s.id);
   return `<div class="sess"><div class="top"><b>${esc(s.name)}</b><span class="chip ${d-p>0.0005?'bad':'ok'}">${d-p>0.0005?'عليه '+kd(d-p):bal>0?'رصيد مقدم '+kd(bal):'لا متبقي'}</span></div>
   <div class="meta">${esc(s.grade||'')} ${s.phone?'• '+esc(s.phone):''} • سعر الحصة ${kd(s.rate)} • ${ss.length} حصة</div>
   <div class="acts" style="margin:6px 0"><div><label>دفعة مقدمة (د.ك)</label><input type="number" step="0.001" min="0" id="a_${s.id}"></div><button class="btn sm" data-adv="${s.id}">إضافة دفعة مقدمة</button></div>${pays.map(y=>`<div class="meta n">${y.date} • ${kd(y.amount)} <button class="btn sm del" data-delP="${y.id}">حذف</button></div>`).join('')}<button class="btn sm del" data-delN="${s.id}">حذف الطالب وحصصه</button></div>`}).join(''):'<div class="box empty">لا يوجد طلاب بعد.</div>'}`;
  $('#addN').onclick=()=>{const n=$('#n_name').value.trim();if(!n){$('#err').textContent='اكتب اسم الطالب.';return}
    S.students.push({id:'t'+Date.now(),name:n,grade:$('#n_grade').value.trim(),phone:$('#n_phone').value.trim(),rate:+$('#n_rate').value||0});save();draw()};
  document.querySelectorAll('[data-adv]').forEach(b=>b.onclick=()=>{const id=b.dataset.adv,v=+$('#a_'+id).value;if(v>0){S.payments.push({id:'p'+Date.now(),sid:id,date:today(),amount:v});save();draw()}});
  document.querySelectorAll('[data-delP]').forEach(b=>b.onclick=()=>{S.payments=S.payments.filter(y=>y.id!==b.dataset.delp);save();draw()});
  document.querySelectorAll('[data-delN]').forEach(b=>b.onclick=()=>{if(b.dataset.sure){const id=b.dataset.deln;S.students=S.students.filter(x=>x.id!==id);S.sessions=S.sessions.filter(x=>x.sid!==id);S.payments=S.payments.filter(x=>x.sid!==id);save();draw()}else{b.dataset.sure=1;b.textContent='تأكيد الحذف'}});
}

/* ---- report ---- */
function filtered(){return S.sessions.filter(s=>(!fStu||s.sid===fStu)&&(!fMonth||s.date.startsWith(fMonth))).sort((a,b)=>(a.date+a.start).localeCompare(b.date+b.start))}
function drawReport(){
  const L=filtered(),due=sum(L,s=>s.due),paid=sum(L,eff),mn=sum(L,s=>s.att?mins(s.start,s.end):0);
  const per=S.students.map(t=>{const x=L.filter(s=>s.sid===t.id);return{t,n:x.length,a:x.filter(s=>s.att).length,d:sum(x,s=>s.due),p:sum(x,eff)}}).filter(r=>r.n);
  $('#main').innerHTML=`<div class="box"><div class="row">
   <div><label>الطالب</label><select id="r_stu"><option value="">كل الطلاب</option>${S.students.map(s=>`<option value="${s.id}" ${s.id===fStu?'selected':''}>${esc(s.name)}</option>`).join('')}</select></div>
   <div><label>الشهر</label><input type="month" id="r_m" value="${fMonth}"></div></div></div>
  <div class="total"><div><small>مجموع الدفعات</small><span class="big n">${kd(paid)}</span></div><div><small>المستحق</small><span class="big n">${kd(due)}</span></div><div><small>المتبقي</small><span class="big n">${kd(Math.max(0,due-paid))}</span></div></div>
  <p class="sub" style="margin-top:8px">${L.length} حصة • حضور ${L.filter(s=>s.att).length} • غياب ${L.filter(s=>!s.att).length} • مدة الحصص الحاضرة ${dur(mn)||'0'} • رصيد مقدم متبقٍ ${kd(fStu?(credit[fStu]||0):sum(Object.values(credit),x=>x))}</p>
  ${per.length?`<div class="box"><h2>ملخص لكل طالب</h2><div class="scroll"><table><thead><tr><th>الطالب</th><th>الحصص</th><th>الحضور</th><th>المستحق</th><th>المدفوع</th><th>المتبقي</th></tr></thead><tbody>${per.map(r=>`<tr><td>${esc(r.t.name)}</td><td>${r.n}</td><td>${r.a}</td><td class="n">${kd(r.d)}</td><td class="n">${kd(r.p)}</td><td class="n">${kd(Math.max(0,r.d-r.p))}</td></tr>`).join('')}</tbody></table></div></div>`:''}
  <div class="box"><div class="bar"><h2 style="margin:0">تفصيل الحصص</h2><button class="btn ghost sm" id="csv">تنزيل CSV</button></div>
  ${L.length?`<div class="scroll"><table><thead><tr><th>التاريخ</th><th>اليوم</th><th>الطالب</th><th>بداية الحصة</th><th>نهاية الحصة</th><th>المدة</th><th>الحضور</th><th>التفاعل</th><th>المستحق</th><th>المدفوع</th><th>الحالة</th></tr></thead><tbody>${L.map(s=>`<tr><td class="n">${s.date}</td><td>${dayN(s.date)}</td><td>${esc(stu(s.sid).name)}</td><td class="n">${s.start}</td><td class="n">${s.end}</td><td>${dur(mins(s.start,s.end))||'-'}</td><td>${s.att?'حضر':'غاب'}</td><td>${s.att?stars(s.eng):'-'}</td><td class="n">${kd(s.due)}</td><td class="n">${kd(eff(s))}</td><td>${status(s)[0]}</td></tr>`).join('')}</tbody><tfoot><tr><td colspan="8">المجموع</td><td class="n">${kd(due)}</td><td class="n">${kd(paid)}</td><td></td></tr></tfoot></table></div>`:'<div class="empty">لا توجد حصص ضمن هذا الفلتر.</div>'}</div>`;
  $('#r_stu').onchange=e=>{fStu=e.target.value;draw()};$('#r_m').onchange=e=>{fMonth=e.target.value;draw()};
  $('#csv').onclick=async()=>{
    const q=v=>'"'+String(v).replace(/"/g,'""')+'"';
    const rows=[['التاريخ','الطالب','البداية','النهاية','الحضور','التفاعل','المستحق KWD','المدفوع KWD','المتبقي KWD','ملاحظات'],...L.map(s=>[s.date,stu(s.sid).name,s.start,s.end,s.att?'حضر':'غاب',s.att?s.eng:'',(+s.due).toFixed(3),eff(s).toFixed(3),Math.max(0,s.due-eff(s)).toFixed(3),s.note||''])];
    const data='\ufeff'+rows.map(r=>r.map(q).join(',')).join('\n');
    try{const d=await claude.use('downloads');if(d)await d.save({filename:'tutoring-report.csv',data})}catch(e){}
  };
}
$('#bkB').onclick=async()=>{const data=JSON.stringify({students:S.students,sessions:S.sessions.map(({_adv,...r})=>r),payments:S.payments});let ok=false;try{const d=await claude.use('downloads');if(d){await d.save({filename:'tutoring-backup-'+today()+'.json',data});ok=true}}catch(e){}
 $('#bkM').textContent=ok?'تم تجهيز الملف. احفظه في تطبيق «الملفات» (iCloud Drive).':'تعذر التنزيل: انسخ النص أدناه واحفظه في تطبيق «ملاحظات».';if(!ok){const t=$('#bkT');t.hidden=false;t.value=data;t.select()}};
$('#bkR').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const o=JSON.parse(await f.text());if(!Array.isArray(o.students)||!Array.isArray(o.sessions))throw 0;S={students:o.students,sessions:o.sessions,payments:o.payments||[]};await save();draw();$('#bkM').textContent='تمت الاستعادة.'}catch(x){$('#bkM').textContent='الملف غير صالح.'}e.target.value=''};
init();
</script>
</body>
</html>
