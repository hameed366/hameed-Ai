<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>سجل الدروس الخصوصية</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f6fa;--grid:#e8e9ef;--card:#fff;--ink:#14213d;--mut:#667085;--line:#d7dbe5;--pri:#14213d;--priT:#fff;--ok:#1d7a4a;--okB:#e1f3e8;--bad:#b3341f;--badB:#fbe6e1;--warn:#8a5a00;--warnB:#fdf0d2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1b1a;--grid:#162a28;--card:#142524;--ink:#e4f0ee;--mut:#8fa9a6;--line:#27403e;--pri:#4fc3bb;--priT:#06201f;--ok:#6fd49b;--okB:#15382a;--bad:#ff9a86;--badB:#3d1d17;--warn:#f0c15c;--warnB:#3a2d0c}}
:root[data-theme="dark"]{--bg:#0e1b1a;--grid:#162a28;--card:#142524;--ink:#e4f0ee;--mut:#8fa9a6;--line:#27403e;--pri:#4fc3bb;--priT:#06201f;--ok:#6fd49b;--okB:#15382a;--bad:#ff9a86;--badB:#3d1d17;--warn:#f0c15c;--warnB:#3a2d0c}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background-color:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px;color:var(--ink);font-family:"IBM Plex Sans Arabic",Tahoma,sans-serif;line-height:1.6}
.wrap{max-width:880px;margin:0 auto;padding:16px 14px 60px}
h1{font-size:1.5rem;margin:6px 0 2px}
.sub{color:var(--mut);margin:0 0 14px;font-size:.92rem}
.total{background:var(--pri);color:var(--priT);border-radius:14px;padding:16px 18px;display:flex;flex-wrap:wrap;gap:6px 24px;align-items:baseline;justify-content:space-between}
.total .big{font-size:2.1rem;font-weight:700;line-height:1.2}
.total small{opacity:.85;display:block;font-size:.85rem}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:10px 0 14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.stat b{display:block;font-size:1.1rem}.stat span{color:var(--mut);font-size:.82rem}
nav{display:flex;gap:4px;border-bottom:2px solid var(--line);margin-bottom:14px}
nav button{flex:1;background:none;border:0;padding:10px 4px;font:inherit;font-weight:500;color:var(--mut);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px}
nav button.on{color:var(--pri);border-bottom-color:var(--pri);font-weight:700}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
.box h2{font-size:1.05rem;margin:0 0 10px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
label{display:block;font-size:.85rem;color:var(--mut);margin-bottom:2px}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
input:focus-visible,select:focus-visible,button:focus-visible,textarea:focus-visible{outline:2px solid var(--pri);outline-offset:1px}
.btn{font:inherit;font-weight:700;background:var(--pri);color:var(--priT);border:0;border-radius:8px;padding:9px 16px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--pri);border:1px solid var(--pri)}
.btn.sm{padding:4px 10px;font-size:.82rem}
.btn.del{background:transparent;color:var(--bad);border:1px solid var(--bad)}
.chip{display:inline-block;border-radius:99px;padding:1px 10px;font-size:.8rem;font-weight:500}
.ok{background:var(--okB);color:var(--ok)}.bad{background:var(--badB);color:var(--bad)}.warn{background:var(--warnB);color:var(--warn)}
.sess{border:1px solid var(--line);border-inline-start:5px solid var(--pri);border-radius:10px;background:var(--card);padding:10px 12px;margin-bottom:10px}
.sess.absent{border-inline-start-color:var(--bad)}
.sess .top{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center}
.sess .meta{color:var(--mut);font-size:.88rem;margin:2px 0 8px}
.sess .acts{display:flex;gap:8px;flex-wrap:wrap;align-items:end}
.sess .acts>div{width:110px}
.stars{color:#d99a00;letter-spacing:1px}
.empty{text-align:center;color:var(--mut);padding:22px 8px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.88rem;min-width:860px}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:start;white-space:nowrap}
th{color:var(--mut);font-weight:500}
tfoot td{font-weight:700;border-top:2px solid var(--ink)}
.n{font-variant-numeric:tabular-nums}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.save{position:fixed;inset-inline-start:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);border-radius:8px;padding:4px 12px;font-size:.8rem;opacity:0;transition:opacity .2s}
.save.on{opacity:.9}
:root{--g1:#14213d;--g2:#9a762c;--g3:#d8b45a}
:root[data-skin="magic"]{--pri:#7c3aed;--priT:#fff;--g1:#7c3aed;--g2:#c026d3;--g3:#e11d48}
:root[data-skin="sunset"]{--pri:#e0531f;--priT:#fff;--g1:#e11d48;--g2:#ea580c;--g3:#d97706}
:root[data-skin="ocean"]{--pri:#0369a1;--priT:#fff;--g1:#0369a1;--g2:#4f46e5;--g3:#0891b2}
:root[data-skin="aurora"]{--pri:#059669;--priT:#fff;--g1:#047857;--g2:#0e7490;--g3:#6d28d9}
h1::after{content:"";display:block;height:4px;width:90px;border-radius:4px;margin-top:4px;background:linear-gradient(90deg,var(--g1),var(--g2),var(--g3))}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(circle at 15% 10%,color-mix(in srgb,var(--g2) 22%,transparent),transparent 45%),radial-gradient(circle at 90% 85%,color-mix(in srgb,var(--g3) 20%,transparent),transparent 45%)}
.total{background:linear-gradient(120deg,var(--g1),var(--g2),var(--g3),var(--g1));background-size:300% 300%;animation:mg 10s ease infinite;color:#fff;box-shadow:0 8px 24px -10px var(--g2)}
@keyframes mg{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
.btn{background:linear-gradient(120deg,var(--g1),var(--g2));color:#fff}
.skins{display:flex;gap:8px;margin:0 0 12px}
.skins button{width:28px;height:28px;border-radius:50%;border:2px solid var(--card);box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0}
.skins button.on{box-shadow:0 0 0 2px var(--ink)}
.live{border:2px solid transparent;background:linear-gradient(var(--card),var(--card)) padding-box,linear-gradient(120deg,var(--g1),var(--g2),var(--g3)) border-box}
.live .meta{color:var(--mut);font-size:.88rem;margin:4px 0 10px}
.clk{font-size:2.4rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
#alarm{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));inset-inline:10px;z-index:60;background:#b3341f;color:#fff;border-radius:12px;padding:12px 14px;display:none;align-items:center;justify-content:space-between;gap:10px;font-weight:700;animation:fl .8s ease-in-out infinite alternate}
#alarm.on{display:flex}
@keyframes fl{to{opacity:.75}}
#pv{display:none;position:fixed;inset:0;z-index:70;background:#fff;color:#12302f;overflow:auto;padding-top:env(safe-area-inset-top,0px)}
#pv.on{display:block}
.pvbar{position:sticky;top:0;display:flex;gap:8px;flex-wrap:wrap;padding:10px;background:#f5f8f7;border-bottom:1px solid #cddad7}
#pv .btn.ghost{color:#0f5a57;border-color:#0f5a57}
.pvbody{max-width:794px;margin:0 auto}
@media (prefers-reduced-motion:reduce){.total,#alarm{animation:none}}
@media print{.wrap,.save,#alarm{display:none!important}#pv{position:static;overflow:visible;padding:0}.pvbar{display:none}body::before{display:none}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}tr{break-inside:avoid}@page{size:A4;margin:10mm}}

:root[data-skin="luxury"]{--pri:#14213d;--priT:#fff;--g1:#101a30;--g2:#8b6a26;--g3:#d8b45a;--bg:#f7f7fa;--grid:#e8e6df;--ink:#14213d;--line:#ded9ca}
:root[data-skin="luxury"] .box,:root[data-skin="luxury"] .stat,:root[data-skin="luxury"] .sess{box-shadow:0 5px 18px rgba(20,33,61,.055)}
:root[data-skin="luxury"] h1::after{height:4px;width:140px}
nav{overflow-x:auto;scrollbar-width:thin}
nav button{min-width:74px;white-space:nowrap}
.btn:active,nav button:active{transform:translateY(1px)}
input,select,textarea,button{touch-action:manipulation}
input,select,textarea{min-height:42px}
textarea{resize:vertical}
.modalShade{position:fixed;inset:0;z-index:100;background:rgba(8,15,30,.65);display:flex;align-items:center;justify-content:center;padding:16px}
.modal{width:min(620px,100%);max-height:90dvh;overflow:auto;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 24px 70px #0003}
.modal h2{margin:0 0 12px}
.chartBars{display:flex;align-items:flex-end;gap:8px;height:160px;padding:14px 4px 0;border-bottom:1px solid var(--line)}
.chartBar{flex:1;min-width:18px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:5px}
.chartBar i{display:block;width:min(34px,80%);min-height:2px;border-radius:6px 6px 0 0;background:linear-gradient(180deg,#d8b45a,#8b6a26)}
.chartBar small{font-size:.7rem;color:var(--mut);text-align:center}
.chartBar b{font-size:.7rem;font-weight:500}
.kpiGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media(min-width:600px){.kpiGrid{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(max-width:520px){.wrap{padding:10px 9px 55px}h1{font-size:1.3rem}.box{padding:11px}.total .big{font-size:1.65rem}.row{grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}.sess .acts>div{width:calc(50% - 8px)}}
@media print{.modalShade{display:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <h1>سجل الدروس الخصوصية</h1>
  <p class="sub">الحصص، الحضور، التفاعل، والدفعات بالدينار الكويتي</p>
  <div class="skins" id="skins" title="ألوان التطبيق"></div>
  <div id="top"></div><p class="sub" id="cloudStatus" style="margin:6px 0">حالة البيانات: محفوظة محليًا</p>
  <nav>
    <button data-t="sessions" class="on">الحصص</button>
    <button data-t="students">الطلاب</button>
    <button data-t="report">التقارير</button><button data-t="finance">المالية</button><button data-t="schedule">المواعيد</button><button data-t="progress">المستوى</button>
  </nav>
  <main id="main"></main>
  <div class="box"><h2>النسخة الاحتياطية</h2><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn ghost sm" id="bkB">تنزيل نسخة احتياطية</button><label class="btn ghost sm" style="margin:0;cursor:pointer;color:var(--pri)">استعادة من ملف<input type="file" id="bkR" accept=".json,application/json" hidden></label></div><textarea id="bkT" rows="3" hidden style="margin-top:8px"></textarea><p class="sub" id="bkM" style="margin:8px 0 0"></p><p class="sub" id="syncM">حالة المزامنة: محلي على هذا المتصفح</p><button class="btn ghost sm" id="syncNow" type="button">مزامنة الآن</button></div>
</div>
<div class="save" id="save">تم الحفظ</div><div id="modalRoot"></div>
<div id="alarm"><span id="alarmT"></span><button class="btn sm" id="alarmOk" style="background:#fff;color:#b3341f">تم</button></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const kd=n=>(Math.round((+n||0)*1000)/1000).toFixed(3)+' د.ك';
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
let S={students:[],sessions:[],payments:[],appointments:[],expenses:[],progress:[]},tab='sessions',fStu='',fMonth='',docRef=null,cloudState='محلي';
const LS='tutor-manager-v1';
const clean=()=>{const c=JSON.parse(JSON.stringify(S));c.sessions=(c.sessions||[]).map(({_adv,...r})=>r);return c};

/* ---- storage: private db if available, else browser storage ---- */
async function init(){
  try{const raw=localStorage.getItem(LS);if(raw)S=JSON.parse(raw)}catch(e){};S=Object.assign({students:[],sessions:[],payments:[],appointments:[],expenses:[],progress:[]},S);if(!S.appVersion){S.skin='luxury';S.appVersion=2;}['students','sessions','payments','appointments','expenses','progress'].forEach(k=>{if(!Array.isArray(S[k]))S[k]=[]});
  draw();
  try{
    const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
    if(db&&user){
      const id=await user.id();
      if(id){
        docRef=db.collection('data/users/'+id).doc('tutor');
        const snap=await docRef.get();
        if(snap.exists){const local=S,remote=snap.data()||{};if(local.rev&&remote.rev){S=Object.assign({students:[],sessions:[],payments:[],appointments:[],expenses:[],progress:[]},remote.rev>=local.rev?remote:local);['students','sessions','payments','appointments','expenses','progress'].forEach(k=>{if(!Array.isArray(S[k]))S[k]=[]});try{localStorage.setItem(LS,JSON.stringify(clean()))}catch(e){}await docRef.set(clean());cloudState='متصل';draw();return}S=Object.assign({students:[],sessions:[],payments:[],appointments:[],expenses:[],progress:[]},remote);['students','sessions','payments','appointments','expenses','progress'].forEach(k=>{const merged=new Map((Array.isArray(S[k])?S[k]:[]).map(x=>[x.id,x]));(Array.isArray(local[k])?local[k]:[]).forEach(x=>merged.set(x.id,x));S[k]=[...merged.values()]});if(local.teacher&&!S.teacher)S.teacher=local.teacher;if(local.skin)S.skin=local.skin;S.rev=Date.now();try{localStorage.setItem(LS,JSON.stringify(clean()))}catch(e){}await docRef.set(clean());cloudState='متصل';draw()}
        else if(S.students.length||S.sessions.length||S.appointments.length||S.expenses.length){S.rev=Date.now();await docRef.set(clean());cloudState='تم رفع البيانات'}else cloudState='متصل';
      }
    }
  }catch(e){cloudState='محلي فقط'}
}
async function save(){
  S.rev=Date.now();
  try{localStorage.setItem(LS,JSON.stringify(clean()))}catch(e){}
  try{if(docRef){await docRef.set(clean());cloudState='متصل'}}catch(e){cloudState='تعذر التزامن'}
  const el=$('#save');el.classList.add('on');setTimeout(()=>el.classList.remove('on'),1200);
}

/* ---- helpers ---- */
const stu=id=>S.students.find(s=>s.id===id)||{name:'(طالب محذوف)',rate:0};
const mins=(a,b)=>{if(!a||!b)return 0;const[x,y]=a.split(':').map(Number),[p,q]=b.split(':').map(Number);let d=(p*60+q)-(x*60+y);if(d<0)d+=1440;return d};
const dur=m=>m?(m>=60?Math.floor(m/60)+' س ':'')+(m%60?m%60+' د':''):'';
const dayN=d=>{try{return new Date(d+'T00:00:00').toLocaleDateString('ar',{weekday:'long'})}catch(e){return ''}};
const stars=n=>n?'<span class="stars" title="التفاعل">'+'★'.repeat(n)+'☆'.repeat(5-n)+'</span>':'<span class="chip warn">بلا تقييم</span>';
const status=s=>{const d=+s.due||0,p=eff(s);if(d<=0&&p<=0)return['<span class="chip warn">لا مستحقات</span>','warn'];if(p>=d)return['<span class="chip ok">مدفوع</span>','ok'];if(p>0)return['<span class="chip warn">جزئي</span>','warn'];return['<span class="chip bad">غير مدفوع</span>','bad']};
const sum=(a,f)=>a.reduce((t,x)=>t+(+f(x)||0),0);
const eff=s=>(+s.paid||0)+(s._adv||0);
let credit={};
function alloc(){credit={};S.students.forEach(t=>credit[t.id]=sum(S.payments.filter(p=>p.sid===t.id),p=>p.amount));
 [...S.sessions].sort((a,b)=>(a.date+a.start).localeCompare(b.date+b.start)).forEach(s=>{s._adv=0;const need=Math.max(0,(+s.due||0)-(+s.paid||0)),u=Math.min(need,credit[s.sid]||0);if(u>0){s._adv=u;credit[s.sid]-=u}})}

function draw(){
  alloc();const due=sum(S.sessions,s=>s.due),paid=sum(S.sessions,s=>s.paid)+sum(S.payments,p=>p.amount),rem=sum(S.sessions,s=>Math.max(0,s.due-eff(s))),bal=sum(Object.values(credit),x=>x),att=S.sessions.filter(s=>s.att).length;
  const cs=$('#cloudStatus');if(cs)cs.textContent='حالة البيانات: '+(cloudState==='متصل'?'مزامنة سحابية متاحة':cloudState==='تعذر التزامن'?'محفوظة محليًا — تعذرت المزامنة':'محفوظة محليًا على هذا المتصفح');
  $('#top').innerHTML=`<div class="total"><div><small>إجمالي المدفوع</small><span class="big n">${kd(paid)}</span></div><div><small>المتبقي على الطلاب</small><span class="big n">${kd(rem)}</span></div></div>
  <div class="stats"><div class="stat"><b>${S.students.length}</b><span>طلاب</span></div><div class="stat"><b>${S.sessions.length}</b><span>حصص مسجلة</span></div><div class="stat"><b>${att}</b><span>حصص حضرها الطلاب</span></div><div class="stat"><b class="n">${kd(due)}</b><span>إجمالي المستحق</span></div><div class="stat"><b class="n">${kd(bal)}</b><span>أرصدة مقدمة</span></div></div>`;
  document.documentElement.dataset.skin=S.skin||'luxury';
  $('#skins').innerHTML=[['luxury','#14213d','#d8b45a'],['teal','#0f5a57','#1b8f9a'],['magic','#7c3aed','#e11d48'],['sunset','#e11d48','#d97706'],['ocean','#0369a1','#0891b2'],['aurora','#047857','#6d28d9']].map(k=>`<button data-skin="${k[0]}" class="${(S.skin||'luxury')===k[0]?'on':''}" style="background:linear-gradient(135deg,${k[1]},${k[2]})" aria-label="${k[0]}"></button>`).join('');
  document.querySelectorAll('#skins button').forEach(b=>b.onclick=()=>{S.skin=b.dataset.skin;save();draw()});
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
  ({sessions:drawSessions,students:drawStudents,report:drawReport,finance:drawFinance,schedule:drawSchedule,progress:drawProgress})[tab]();
}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;draw()});

/* ---- sessions ---- */
function drawSessions(){
  if(!S.students.length){$('#main').innerHTML='<div class="box empty">أضف طالبًا أولًا من تبويب «الطلاب» ثم سجّل حصصه هنا.</div>';return}
  const opts=S.students.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('');
  const list=[...S.sessions].sort((a,b)=>(b.date+b.start).localeCompare(a.date+a.start));
  $('#main').innerHTML=`<div class="box live" id="liveBox">${liveHTML()}</div>
  <div class="box"><h2>تسجيل حصة</h2>
  <div class="row">
   <div><label>الطالب</label><select id="f_stu">${opts}</select></div>
   <div><label>التاريخ</label><input type="date" id="f_date" value="${today()}"></div>
   <div><label>بداية الحصة</label><input type="time" id="f_start"></div>
   <div><label>نهاية الحصة</label><input type="time" id="f_end"></div>
   <div><label>الحضور</label><select id="f_att"><option value="1">حضر</option><option value="0">غاب</option></select></div>
   <div><label>التفاعل في الحصة</label><select id="f_eng"><option value="5">5 - ممتاز</option><option value="4">4 - جيد جدًا</option><option value="3" selected>3 - متوسط</option><option value="2">2 - ضعيف</option><option value="1">1 - ضعيف جدًا</option></select></div>
   <div><label>المستحق (د.ك)</label><input type="number" step="0.001" min="0" id="f_due"></div>
   <div><label>المدفوع الآن (د.ك)</label><input type="number" step="0.001" min="0" id="f_paid" value="0"></div>
  </div>
  <div style="margin-top:10px"><label>ملاحظات (الدرس، الواجب، نقاط الضعف)</label><textarea id="f_note" rows="2"></textarea></div>
  <div style="margin-top:10px"><button class="btn" id="addS">حفظ الحصة</button> <span id="err" style="color:var(--bad);font-size:.88rem"></span></div></div>
  <div class="bar"><b>آخر الحصص</b></div>
  ${list.length?list.map(sessCard).join(''):'<div class="box empty">لا توجد حصص بعد.</div>'}`;

function addSession(){

function overlap(t1,d1,t2,d2){const m=t=>{const p=(t||'00:00').split(':').map(Number);return p[0]*60+p[1]};return m(t1)<m(t2)+(+d2||60)&&m(t2)<m(t1)+(+d1||60)}
function addMinutes(t,n){const p=t.split(':').map(Number),d=(p[0]*60+p[1]+n)%1440;return String(Math.floor(d/60)).padStart(2,'0')+':'+String(d%60).padStart(2,'0')}
function scheduleConflicts(list){const pairs=[];for(let i=0;i<list.length;i++)for(let j=i+1;j<list.length;j++)if(list[i].date===list[j].date&&overlap(list[i].time,list[i].duration,list[j].time,list[j].duration))pairs.push(`${esc(list[i].date)}: ${esc(list[i].title||'موعد')} (${esc(list[i].time)}) يتداخل مع ${esc(list[j].title||'موعد')} (${esc(list[j].time)})`);return pairs.length?'<ul>'+pairs.map(x=>`<li>${x}</li>`).join('')+'</ul>':'<div class="empty">لا توجد تعارضات بين المواعيد القادمة.</div>'}

let AC=null,prefill=null;

const clock=ms=>{const s=Math.max(0,Math.floor(ms/1000)),h=Math.floor(s/3600),m=Math.floor(s%3600/60);return (h?h+':':'')+String(m).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};

 if(fMonth){try{per=new Date(fMonth+'-01T00:00:00').toLocaleDateString('ar',{month:'long',year:'numeric'})}catch(e){per=fMonth}}
 return{L,n:L.length,att:A.length,abs:L.length-A.length,pct:L.length?Math.round(A.length/L.length*100):0,avg:ev.length?(sum(ev,s=>s.eng)/ev.length).toFixed(1):'-',due,paid,rem:Math.max(0,due-paid),bal:credit[t.id]||0,period:per}}
function waText(t){const r=repData(t);return '*تقرير الطالب: '+t.name+'*\n'+(S.teacher?'المعلم: '+S.teacher+'\n':'')+'الفترة: '+r.period+'\n\nعدد الحصص: '+r.n+' (حضر '+r.att+' / غاب '+r.abs+')\nنسبة الحضور: '+r.pct+'%\nمتوسط التفاعل: '+r.avg+' من 5\n\nالمستحق: '+kd(r.due)+'\nالمدفوع: '+kd(r.paid)+'\nالمتبقي: '+kd(r.rem)+(r.bal>0?'\nرصيد مقدم: '+kd(r.bal):'')+'\n\n*تفاصيل الحصص:*\n'+r.L.map(s=>'- '+s.date+' ('+s.start+' - '+s.end+') '+(s.att?'حضر':'غاب')+(s.att&&s.eng?' | تفاعل '+s.eng+'/5':'')+' | '+kd(s.due)).join('\n')+(r.L.some(s=>s.note)?'\n\n*ملاحظات المعلم:*\n'+r.L.filter(s=>s.note).map(s=>'- '+s.date+': '+s.note).join('\n'):'')+'\n\nشكرًا لكم.'}
function sendWA(id){const t=S.students.find(x=>x.id===id);if(!t)return;alloc();const text=waText(t),d=(t.phone||'').replace(/\D/g,'').replace(/^00/,''),num=d.length===8?'965'+d:d,msg=$('#rpMsg'),ta=$('#rpT');
 let w=null;try{w=window.open('https://wa.me/'+num+'?text='+encodeURIComponent(text),'_blank')}catch(e){}
 if(!w){ta.hidden=false;ta.value=text;msg.textContent='تعذر فتح واتساب مباشرة. انسخ النص أدناه وأرسله يدويًا.'}else{ta.hidden=true;msg.textContent='تم فتح واتساب.'}}
function reportHTML(t){const r=repData(t),C='#0f5a57',cd=(a,b)=>`<div style="flex:1;border:1px solid #cddad7;border-radius:10px;padding:10px 12px;background:#f5f8f7"><div style="font-size:12px;color:#5d7472">${a}</div><div style="font-size:18px;font-weight:700">${b}</div></div>`,
 th=x=>`<th style="padding:8px 4px;background:${C};color:#fff;font-size:12px;text-align:center">${x}</th>`,
 td=(x,st='')=>`<td style="padding:7px 4px;border-bottom:1px solid #dfe8e5;font-size:12px;text-align:center;${st}">${x}</td>`;
 const rows=r.L.map((s,i)=>{const bg=i%2?'background:#f7faf9;':'',k=status(s)[1],stx={ok:'مدفوع',bad:'غير مدفوع',warn:+s.due>0?'جزئي':'-'}[k];
  return '<tr>'+td(s.date,bg)+td(dayN(s.date),bg)+td(s.start,bg)+td(s.end,bg)+td(dur(mins(s.start,s.end))||'-',bg)+td(s.att?'حضر':'غاب',bg+'font-weight:700;color:'+(s.att?'#1d7a4a':'#b3341f'))+td(s.att&&s.eng?'<span style="color:#d99a00">'+'★'.repeat(s.eng)+'</span>':'-',bg)+td(kd(s.due),bg)+td(kd(eff(s)),bg)+td(stx,bg)+'</tr>'}).join('');
 const nt=r.L.filter(s=>s.note);
 return `<div dir="rtl" style="font-family:'IBM Plex Sans Arabic',Tahoma,sans-serif;color:#12302f;background:#fff"><div style="background:${C};color:#fff;padding:26px 32px"><div style="font-size:13px;opacity:.85">تقرير متابعة الدروس الخصوصية - الرياضيات</div><div style="font-size:28px;font-weight:700;margin-top:4px">${esc(t.name)}</div><div style="font-size:13px;margin-top:6px;opacity:.9">${esc(t.grade||'')} ${t.grade?'•':''} الفترة: ${r.period}${S.teacher?' • المعلم: '+esc(S.teacher):''}</div></div>
 <div style="padding:22px 32px"><div style="display:flex;gap:10px">${cd('عدد الحصص',r.n)}${cd('حضر / غاب',r.att+' / '+r.abs)}${cd('نسبة الحضور',r.pct+'%')}${cd('متوسط التفاعل',r.avg+' / 5')}</div>
 <div style="display:flex;gap:10px;margin-top:10px">${cd('المستحق',kd(r.due))}${cd('المدفوع',kd(r.paid))}${cd('المتبقي',kd(r.rem))}${r.bal>0?cd('رصيد مقدم',kd(r.bal)):''}</div>
 <div style="font-size:16px;font-weight:700;margin:20px 0 8px;color:${C}">تفاصيل الحصص</div>
 ${r.L.length?`<table style="width:100%;border-collapse:collapse"><thead><tr>${['التاريخ','اليوم','بداية الحصة','نهاية الحصة','المدة','الحضور','التفاعل','المستحق','المدفوع','الحالة'].map(th).join('')}</tr></thead><tbody>${rows}</tbody></table>`:'<div style="color:#5d7472">لا توجد حصص في هذه الفترة.</div>'}
 ${nt.length?`<div style="font-size:16px;font-weight:700;margin:20px 0 8px;color:${C}">ملاحظات المعلم</div>${nt.map(s=>`<div style="font-size:13px;padding:6px 0;border-bottom:1px solid #dfe8e5"><b>${s.date}:</b> ${esc(s.note)}</div>`).join('')}`:''}
 <div style="margin-top:26px;font-size:11px;color:#5d7472;text-align:center">تاريخ الإصدار: ${today()}</div></div></div>`}
async function makePDF(t){const host=document.createElement('div');host.style.cssText='position:absolute;left:-10000px;top:0;width:794px;background:#fff';host.innerHTML=reportHTML(t);document.body.appendChild(host);
 try{try{await document.fonts.ready}catch(e){}
  const cv=await html2canvas(host,{scale:2,backgroundColor:'#ffffff'}),pdf=new window.jspdf.jsPDF({unit:'pt',format:'a4'}),pw=pdf.internal.pageSize.getWidth(),ph=pdf.internal.pageSize.getHeight(),pagePx=Math.floor(cv.width*ph/pw);
  for(let y=0,first=true;y<cv.height;y+=pagePx){const h=Math.min(pagePx,cv.height-y),c=document.createElement('canvas');c.width=cv.width;c.height=h;c.getContext('2d').drawImage(cv,0,y,cv.width,h,0,0,cv.width,h);if(!first)pdf.addPage();first=false;pdf.addImage(c.toDataURL('image/jpeg',0.92),'JPEG',0,0,pw,h*pw/cv.width)}
  return pdf.output('blob')}finally{host.remove()}}
async function sendPDF(id,b){const t=S.students.find(x=>x.id===id),msg=$('#rpMsg');if(!t)return;
 if(!window.jspdf||!window.html2canvas){msg.textContent='تعذر تحميل أدوات PDF. تأكد من الإنترنت وأعد المحاولة.';return}
 b.disabled=true;msg.textContent='جاري تجهيز التقرير...';
 try{alloc();const blob=await makePDF(t),d=await claude.use('downloads');if(!d)throw{code:'unavailable'};
  await d.save({filename:'تقرير-'+t.name.replace(/[^\w\u0600-\u06FF ]/g,'')+'.pdf',data:blob});msg.textContent='تم تجهيز الملف. أرسله لولي الأمر عبر المشاركة (واتساب).'}
 catch(e){msg.textContent=e&&e.code==='declined'?'تم الإلغاء.':'تعذر تجهيز ملف PDF.'}
 b.disabled=false}

$('#syncNow').onclick=async()=>{const m=$('#syncM');m.textContent='جارٍ فحص المزامنة...';try{const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);if(!db||!user)throw 0;const id=await user.id();if(!id)throw 0;docRef=db.collection('data/users/'+id).doc('tutor');await docRef.set(JSON.parse(JSON.stringify(S)));cloudState='متصل';m.textContent='تمت مزامنة البيانات مع الحساب الحالي.'}catch(e){cloudState='محلي فقط';m.textContent='المزامنة السحابية غير متاحة في هذه البيئة. بياناتك محفوظة محليًا؛ استخدم النسخة الاحتياطية لنقلها بين الأجهزة.'}};

$('#bkB').onclick=async()=>{const clean=JSON.parse(JSON.stringify(S));clean.sessions=clean.sessions.map(({_adv,...r})=>r);const data=JSON.stringify({schemaVersion:2,exportedAt:new Date().toISOString(),...clean},null,2);let ok=false;try{const d=await claude.use('downloads');if(d){await d.save({filename:'tutoring-backup-'+today()+'.json',data});ok=true}}catch(e){}
 if(!ok){try{downloadBlob(data,'tutor-backup-'+today()+'.json','application/json;charset=utf-8');ok=true}catch(e){}}$('#bkM').textContent=ok?'تم تجهيز ملف النسخة الاحتياطية. احفظه في تطبيق «الملفات» (iCloud Drive).':'تعذر التنزيل: انسخ النص أدناه واحفظه في تطبيق «ملاحظات».';if(!ok){const t=$('#bkT');t.hidden=false;t.value=data;t.select()}};
$('#bkR').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const o=JSON.parse(await f.text());if(!Array.isArray(o.students)||!Array.isArray(o.sessions))throw 0;if(!confirm('سيتم استبدال البيانات الحالية بالنسخة الاحتياطية. هل تريد المتابعة؟'))return;S=Object.assign({students:[],sessions:[],payments:[],appointments:[],expenses:[],progress:[]},o);['students','sessions','payments','appointments','expenses','progress'].forEach(k=>{if(!Array.isArray(S[k]))S[k]=[]});await save();draw();$('#bkM').textContent='تمت الاستعادة بنجاح، مع الاحتفاظ بالإعدادات والبيانات المدعومة.'}catch(x){$('#bkM').textContent='الملف غير صالح.'}e.target.value=''};
init();
</script>
